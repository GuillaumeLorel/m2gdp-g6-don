name = "doneo-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Compte Cloudflare qui heberge le Worker (celui de Guillaume). Ce n'est pas un
# secret : sans lui, un membre invite qui a plusieurs comptes se verrait
# demander lequel utiliser, ou deploierait sur le mauvais.
account_id = "af6e99118eacb7dae1f71bab594ad0ed"

# CORS : restreindre l'acces au worker aux domaines du front (voir agents.md).
# Liste separee par des virgules ; « * » remplace un segment d'adresse (apercus
# Vercel). Le code autorise en plus localhost, sinon le dev en local est
# impossible. doneo.web.app reste le temps de la migration vers Vercel.
[vars]
ALLOWED_ORIGIN = "https://doneo.web.app"
# Identifiant du projet Firebase : sert a valider l'audience des jetons.
# Public, contrairement a la cle de service qui reste dans les secrets.
FIREBASE_PROJECT_ID = "doneo-3561b"

# Base D1 (sessions, SQL) — creee le 16/09/2026, region WEUR.
# Le binding reste DB_SESSIONS : c'est le nom lu par le code, il ne suit pas
# celui de la ressource.
[[d1_databases]]
binding = "DB_SESSIONS"
database_name = "doneo-sessions"
database_id = "83153df8-eded-4ac6-b35b-749f7efe3a9c"

# Bucket R2 (fichiers / photos) — cree le 16/09/2026.
[[r2_buckets]]
binding = "BUCKET_FICHIERS"
bucket_name = "doneo-fichiers"

# Secrets a definir via `wrangler secret put` (JAMAIS en clair ici) :
#   FIREBASE_SERVICE_ACCOUNT   -> contenu de la cle de service du projet doneo
#   FIREBASE_API_KEY
