name = "m2gdp-g6-don"
main = "src/index.js"
compatibility_date = "2026-01-01"

# CORS : restreindre l'accès au worker au domaine du front (voir agents.md).
# Le code autorise en plus localhost, sinon le dev en local est impossible.
[vars]
ALLOWED_ORIGIN = "https://projet-bon-debarras-app.web.app"
# Identifiant du projet Firebase : sert à valider l'audience des jetons.
# Public, contrairement à la clé de service qui reste dans les secrets.
FIREBASE_PROJECT_ID = "projet-bon-debarras"

# Base D1 (sessions, SQL) — créée le 09/09/2026, région WEUR
[[d1_databases]]
binding = "DB_SESSIONS"
database_name = "m2gdp-g6-don-sessions"
database_id = "982e2d7f-4610-4c0e-a28e-ff850ac588ee"

# Bucket R2 (fichiers / photos)
[[r2_buckets]]
binding = "BUCKET_FICHIERS"
bucket_name = "m2gdp-g6-don-fichiers"

# Secrets à définir via `wrangler secret put` (JAMAIS en clair ici) :
#   FIREBASE_SERVICE_ACCOUNT   -> contenu de la service account key
#   FIREBASE_API_KEY
